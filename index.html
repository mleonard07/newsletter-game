<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The CI Word — Community Impact</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Georgia', serif;
      background: #f9f6f0;
      color: #1a1a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 0 12px 40px;
    }

    /* ── Header ── */
    header {
      width: 100%;
      max-width: 500px;
      border-bottom: 3px double #bb2f2c;
      text-align: center;
      padding: 18px 0 12px;
      margin-bottom: 20px;
    }
    .ci-logo {
      width: 180px;
      margin-bottom: 10px;
    }
    header h1 {
      font-size: 36px;
      font-weight: 900;
      letter-spacing: -1px;
      line-height: 1;
      margin: 4px 0 2px;
    }
    header .tagline {
      font-size: 12px;
      color: #555;
      font-style: italic;
    }

    /* ── Message bar ── */
    #message {
      height: 28px;
      font-size: 14px;
      font-weight: bold;
      color: #c0392b;
      font-family: 'Arial', sans-serif;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
      text-align: center;
    }

    /* ── Grid ── */
    #grid {
      display: grid;
      grid-template-rows: repeat(6, 1fr);
      gap: 6px;
      margin-bottom: 20px;
    }

    .row {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .tile {
      width: 58px;
      height: 58px;
      border: 2px solid #c8c8c8;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 900;
      text-transform: uppercase;
      user-select: none;
      transition: transform 0.08s;
      background: #fff;
    }

    .tile.filled { border-color: #888; }
    .tile.pop { transform: scale(1.08); }

    .tile.correct  { background: #bb2f2c; border-color: #bb2f2c; color: #fff; }
    .tile.present  { background: #c9a227; border-color: #c9a227; color: #fff; }
    .tile.absent   { background: #6e6e6e; border-color: #6e6e6e; color: #fff; }

    /* ── Shake animation ── */
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }
    .row.shake { animation: shake 0.4s ease; }

    /* ── Flip animation ── */
    @keyframes flipIn  { 0% { transform: rotateX(0); } 50% { transform: rotateX(-90deg); } }
    @keyframes flipOut { 50% { transform: rotateX(-90deg); } 100% { transform: rotateX(0); } }

    /* ── Keyboard ── */
    #keyboard {
      display: flex;
      flex-direction: column;
      gap: 8px;
      align-items: center;
    }

    .kb-row { display: flex; gap: 6px; }

    .key {
      height: 56px;
      min-width: 40px;
      padding: 0 6px;
      border: none;
      border-radius: 4px;
      background: #d3d6da;
      color: #1a1a1a;
      font-size: 13px;
      font-weight: bold;
      font-family: 'Arial', sans-serif;
      text-transform: uppercase;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, color 0.2s;
      letter-spacing: 0.5px;
    }
    .key.wide { min-width: 64px; font-size: 12px; }
    .key:active { filter: brightness(0.9); }

    .key.correct { background: #bb2f2c; color: #fff; }
    .key.present { background: #c9a227; color: #fff; }
    .key.absent  { background: #6e6e6e; color: #fff; }

    /* ── Win/lose overlay ── */
    #overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #overlay.show { display: flex; }

    #result-card {
      background: #fff;
      border: 3px double #bb2f2c;
      border-radius: 8px;
      padding: 32px 40px;
      text-align: center;
      max-width: 340px;
      width: 90%;
    }
    #result-card .result-label {
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #888;
      font-family: 'Arial', sans-serif;
      margin-bottom: 8px;
    }
    #result-card .result-word {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }
    #result-card .result-msg {
      font-size: 15px;
      color: #444;
      font-style: italic;
      margin-bottom: 20px;
    }
    #result-card .result-guesses {
      font-size: 13px;
      font-family: 'Arial', sans-serif;
      color: #666;
      margin-bottom: 24px;
    }
    #play-again {
      background: #bb2f2c;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 12px 28px;
      font-size: 14px;
      font-family: 'Arial', sans-serif;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      cursor: pointer;
    }
    #play-again:hover { background: #444; }

    /* ── Hint section ── */
    #hint-area {
      margin-top: 16px;
      font-size: 12px;
      color: #888;
      font-family: 'Arial', sans-serif;
      text-align: center;
    }
    #hint-btn {
      background: none;
      border: 1px solid #bbb;
      border-radius: 4px;
      padding: 4px 12px;
      font-size: 12px;
      color: #888;
      cursor: pointer;
      margin-top: 6px;
    }
    #hint-btn:hover { background: #eee; }
    #hint-text { margin-top: 6px; font-style: italic; color: #555; min-height: 16px; }
  </style>
</head>

}

  for (let c = 0; c < 5; c++) {
    const tile = document.createElement('div');
    tile.className = 'tile';
    rowEl.appendChild(tile);
    grid[r][c] = tile;
  }
  gridEl.appendChild(rowEl);
}

// ── Build keyboard ──
const rows = [
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L'],
  ['ENTER','Z','X','C','V','B','N','M','⌫']
];
const kbEl = document.getElementById('keyboard');
rows.forEach(keys => {
  const rowEl = document.createElement('div');
  rowEl.className = 'kb-row';
  keys.forEach(k => {
    const btn = document.createElement('button');
    btn.className = 'key' + (k === 'ENTER' || k === '⌫' ? ' wide' : '');
    btn.textContent = k;
    btn.addEventListener('click', () => handleKey(k));
    rowEl.appendChild(btn);
    if (k !== 'ENTER' && k !== '⌫') keyEls[k] = btn;
  });
  kbEl.appendChild(rowEl);
});

// ── Input handling ──
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Enter') handleKey('ENTER');
  else if (e.key === 'Backspace') handleKey('⌫');
  else if (/^[a-zA-Z]$/.test(e.key)) handleKey(e.key.toUpperCase());
});

function handleKey(k) {
  if (gameOver) return;
  if (k === '⌫') deleteLetter();
  else if (k === 'ENTER') submitGuess();
  else addLetter(k);
}

function addLetter(l) {
  if (currentCol >= 5) return;
  const tile = grid[currentRow][currentCol];
  tile.textContent = l;
  tile.classList.add('filled', 'pop');
  setTimeout(() => tile.classList.remove('pop'), 100);
  currentGuess.push(l);
  currentCol++;
}

function deleteLetter() {
  if (currentCol === 0) return;
  currentCol--;
  currentGuess.pop();
  const tile = grid[currentRow][currentCol];
  tile.textContent = '';
  tile.classList.remove('filled');
}

// ── Validate (basic 5-letter check; swap for a full dictionary if desired) ──
function isValidWord(word) {
  // Accept any 5-letter sequence for simplicity
  return word.length === 5;
}

// ── Score a guess ──
function scoreGuess(guess) {
  const result = Array(5).fill('absent');
  const targetArr = TARGET.split('');
  const guessArr  = guess.split('');
  const targetPool = [...targetArr];

  // First pass — correct
  for (let i = 0; i < 5; i++) {
    if (guessArr[i] === targetArr[i]) {
      result[i] = 'correct';
      targetPool[i] = null;
    }
  }
  // Second pass — present
  for (let i = 0; i < 5; i++) {
    if (result[i] !== 'correct') {
      const idx = targetPool.indexOf(guessArr[i]);
      if (idx !== -1) {
        result[i] = 'present';
        targetPool[idx] = null;
      }
    }
  }
  return result;
}

function setMessage(msg, color) {
  const el = document.getElementById('message');
  el.textContent = msg;
  el.style.color = color || '#c0392b';
}

// ── Submit guess ──
function submitGuess() {
  if (currentCol < 5) {
    setMessage('Not enough letters');
    shakeRow(currentRow);
    return;
  }

  const word = currentGuess.join('');

  if (!isValidWord(word)) {
    setMessage('Not a valid word');
    shakeRow(currentRow);
    return;
  }

  setMessage('');
  const result = scoreGuess(word);
  revealRow(currentRow, word, result);
}

function shakeRow(r) {
  const rowEl = gridEl.children[r];
  rowEl.classList.add('shake');
  rowEl.addEventListener('animationend', () => rowEl.classList.remove('shake'), { once: true });
}

function revealRow(r, word, result) {
  const tiles = grid[r];
  const delay = 300; // ms per tile

  // Reset state immediately so the user can start typing the next row
  // while the flip animation plays in the background
  const won = result.every(res => res === 'correct');
  currentRow++;
  currentGuess = [];
  currentCol = 0;

  tiles.forEach((tile, i) => {
    setTimeout(() => {
      tile.style.transition = 'transform 0.15s';
      tile.style.transform = 'rotateX(90deg)';
      setTimeout(() => {
        tile.classList.add(result[i]);
        tile.style.transform = 'rotateX(0deg)';
      }, 150);
    }, i * delay);
  });

  // After all tiles revealed, update keyboard colors and check win/lose
  setTimeout(() => {
    word.split('').forEach((letter, i) => {
      const keyEl = keyEls[letter];
      if (!keyEl) return;
      const cur = keyEl.dataset.state || '';
      const priority = { correct: 3, present: 2, absent: 1 };
      if ((priority[result[i]] || 0) > (priority[cur] || 0)) {
        keyEl.classList.remove(cur);
        keyEl.classList.add(result[i]);
        keyEl.dataset.state = result[i];
      }
    });

    if (won) {
      endGame(true, r + 1);
    } else if (currentRow >= 6) {
      endGame(false, 0);
    }
  }, 5 * delay + 200);
}

// ── End game ──
function endGame(won, guessCount) {
  gameOver = true;
  const messages = {
    1: "Hole in one! Incredible!",
    2: "Brilliant. Two and done.",
    3: "Impressive work!",
    4: "Solid. Well done.",
    5: "Phew — just made it!",
    6: "Cutting it close, but you got there!"
  };
  document.getElementById('result-word').textContent = TARGET;
  document.getElementById('result-msg').textContent = won
    ? messages[guessCount] || "You got it!"
    : "Better luck tomorrow!";
  document.getElementById('result-guesses').textContent = won
    ? `Solved in ${guessCount} ${guessCount === 1 ? 'guess' : 'guesses'}`
    : `The word was ${TARGET}`;

  setTimeout(() => {
    document.getElementById('overlay').classList.add('show');
  }, 800);
}

// ── Hint button ──
document.getElementById('hint-btn').addEventListener('click', () => {
  document.getElementById('hint-text').textContent = `Hint: ${HINT}`;
  document.getElementById('hint-btn').style.display = 'none';
});

// ── Play again (cycles to next word) ──
document.getElementById('play-again').addEventListener('click', () => {
  // Advance to next word
  const idx = WORDS.indexOf(WORDS.find(([w]) => w === TARGET));
  const next = WORDS[(idx + 1) % WORDS.length];
  TARGET = next[0].toUpperCase();
  HINT   = next[1];

  // Reset state
  currentRow = 0;
  currentCol = 0;
  currentGuess = [];
  gameOver = false;

  // Clear grid
  grid.forEach(row => row.forEach(tile => {
    tile.textContent = '';
    tile.className = 'tile';
    tile.style.transform = '';
    tile.style.transition = '';
  }));

  // Clear keyboard
  Object.values(keyEls).forEach(k => {
    k.className = 'key';
    delete k.dataset.state;
  });

  setMessage('');
  document.getElementById('hint-btn').style.display = '';
  document.getElementById('hint-text').textContent = '';
  document.getElementById('overlay').classList.remove('show');
});
</script>
